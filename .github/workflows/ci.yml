# CI — PR と main への push で、手元と同じ `mvn verify` を実行して全検査を行う
#
# 検査の中身は親 pom（https://github.com/SES-AI-Assistant/SesAiAssistantCore/tree/main/tools/nectar-parent）が決めている。verify では次の順に検査する。
#   UT の全 PASS（surefire）→ 整形（spotless）→ LINT（checkstyle / PMD / CPD）
#   → カバレッジ 100%（JaCoCo の命令・分岐）→ UT 仕様の検査とテスト仕様書 HTML の出力 → バグ検出（spotbugs）
# コマンドの体系は https://github.com/SES-AI-Assistant/SesAiAssistantCore/blob/main/tools/README.md を参照。
# テスト結果、カバレッジレポート、テスト仕様書は Artifacts に14日間保存する。
# 検査の違反箇所は注釈で、結果は実行画面の Summary で読める（.github/scripts/ci-report.mjs）。Maven のログは折りたたむ。
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 親 pom（nectar-parent）、Core、nectar-bom / nectar-test-support / nectar-ut-spec-plugin は
    # SesAiAssistantCore の GitHub Packages から取得するため、deploy.yml と同じ PAT で認証する
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      MAVEN_ARGS: -B --settings .github/maven-settings.xml
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: JDK をセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Maven のログは長いため、折りたたみ（group）にして全文を残す。失敗したときだけ [ERROR] の行を折りたたみの外にも出す
      - name: 全検査（mvn verify）
        shell: bash
        run: |
          set +e
          echo "::group::Maven のビルドログ（全文）"
          mvn $MAVEN_ARGS -ntp clean verify 2>&1 | tee "$RUNNER_TEMP/mvn.log"
          status=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            grep '^\[ERROR\]' "$RUNNER_TEMP/mvn.log" | head -40
          fi
          exit "$status"

      # 検査ごとの違反箇所を注釈（実行画面の上部と PR の該当行）に出し、結果を Summary とログ末尾にまとめる。
      # mvn の成否は変えない。スクリプトは .github/scripts/ci-report.mjs
      - name: 検査結果をまとめる
        if: always()
        run: node .github/scripts/ci-report.mjs "$RUNNER_TEMP/mvn.log"

      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/TEST-*.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: カバレッジレポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: テスト仕様書を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-spec
          path: target/nectar-ut-spec/
          retention-days: 14
          if-no-files-found: ignore
